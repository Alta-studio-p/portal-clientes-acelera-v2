name: Import diario de Fathom

on:
  schedule:
    # 20:00 hora Colombia/México (UTC-5) = 01:00 UTC del día siguiente
    - cron: "0 1 * * *"
  workflow_dispatch: {}

jobs:
  import:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      FATHOM_SOURCE_MARI_API_KEY: ${{ secrets.FATHOM_SOURCE_MARI_API_KEY }}
      FATHOM_SOURCE_ROSS_API_KEY: ${{ secrets.FATHOM_SOURCE_ROSS_API_KEY }}
      FATHOM_SOURCE_ALEX_API_KEY: ${{ secrets.FATHOM_SOURCE_ALEX_API_KEY }}
      FATHOM_SOURCE_JOTA_API_KEY: ${{ secrets.FATHOM_SOURCE_JOTA_API_KEY }}
      FATHOM_SOURCE_LORENA_API_KEY: ${{ secrets.FATHOM_SOURCE_LORENA_API_KEY }}
      BACKFILL_SOURCE_MARI_DAYS: "14"
      BACKFILL_SOURCE_ROSS_DAYS: "14"
      BACKFILL_SOURCE_ALEX_DAYS: "14"
      BACKFILL_SOURCE_JOTA_DAYS: "14"
      BACKFILL_SOURCE_LORENA_DAYS: "14"
      OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
      LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
      OPENROUTER_BASE_URL: ${{ secrets.OPENROUTER_BASE_URL }}
      LLM_BASE_URL: ${{ secrets.LLM_BASE_URL }}
      OPENROUTER_MODEL: ${{ secrets.OPENROUTER_MODEL }}
      LLM_MODEL: ${{ secrets.LLM_MODEL }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Import de llamadas nuevas (Fathom -> Supabase)
        run: node scripts/import-fathom-v2.mjs --apply

      - name: Traduce resúmenes y próximos pasos al español
        if: ${{ env.OPENROUTER_API_KEY != '' || env.LLM_API_KEY != '' }}
        continue-on-error: true
        run: node scripts/translate-call-texts-es.mjs --apply

      - name: Normaliza nombres de cliente (determinístico)
        run: node scripts/normalize-client-names.mjs --apply

      - name: Enriquece nombres de cliente con LLM
        if: ${{ env.OPENROUTER_API_KEY != '' || env.LLM_API_KEY != '' }}
        continue-on-error: true
        run: node scripts/enrich-client-names.mjs --apply

      - name: Enriquece títulos de llamada con LLM
        if: ${{ env.OPENROUTER_API_KEY != '' || env.LLM_API_KEY != '' }}
        continue-on-error: true
        run: node scripts/enrich-call-titles.mjs --apply

      - name: Enriquece rango salarial con LLM
        if: ${{ env.OPENROUTER_API_KEY != '' || env.LLM_API_KEY != '' }}
        continue-on-error: true
        run: node scripts/enrich-salary-range.mjs --apply
