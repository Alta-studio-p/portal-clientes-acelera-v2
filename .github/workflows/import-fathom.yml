name: Import diario de Fathom

on:
  schedule:
    # 20:00 hora Colombia/México (UTC-5) = 01:00 UTC del día siguiente
    - cron: "0 1 * * *"
  workflow_dispatch:
    inputs:
      backfill_days:
        description: "Dias hacia atras para todas las fuentes. 0 = historial completo; vacio = 14."
        required: false
        default: ""
      audit_only:
        description: "Solo comparar con Fathom, sin guardar datos ni enriquecer."
        type: boolean
        default: false

concurrency:
  group: fathom-supabase-import
  cancel-in-progress: false

jobs:
  import:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      FATHOM_AUDIT_ONLY: ${{ github.event.inputs.audit_only || 'false' }}
      NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      FATHOM_SOURCE_MARI_API_KEY: ${{ secrets.FATHOM_SOURCE_MARI_API_KEY }}
      FATHOM_SOURCE_ROSS_API_KEY: ${{ secrets.FATHOM_SOURCE_ROSS_API_KEY }}
      FATHOM_SOURCE_ALEX_API_KEY: ${{ secrets.FATHOM_SOURCE_ALEX_API_KEY }}
      FATHOM_SOURCE_JOTA_API_KEY: ${{ secrets.FATHOM_SOURCE_JOTA_API_KEY }}
      FATHOM_SOURCE_LORENA_API_KEY: ${{ secrets.FATHOM_SOURCE_LORENA_API_KEY }}
      FATHOM_SOURCE_CARO_API_KEY: ${{ secrets.FATHOM_SOURCE_CARO_API_KEY }}
      BACKFILL_SOURCE_MARI_DAYS: ${{ github.event.inputs.backfill_days || '14' }}
      BACKFILL_SOURCE_ROSS_DAYS: ${{ github.event.inputs.backfill_days || '14' }}
      BACKFILL_SOURCE_ALEX_DAYS: ${{ github.event.inputs.backfill_days || '14' }}
      BACKFILL_SOURCE_JOTA_DAYS: ${{ github.event.inputs.backfill_days || '14' }}
      BACKFILL_SOURCE_LORENA_DAYS: ${{ github.event.inputs.backfill_days || '14' }}
      BACKFILL_SOURCE_CARO_DAYS: ${{ github.event.inputs.backfill_days || '14' }}
      OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
      LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
      OPENROUTER_BASE_URL: ${{ secrets.OPENROUTER_BASE_URL }}
      LLM_BASE_URL: ${{ secrets.LLM_BASE_URL }}
      OPENROUTER_MODEL: ${{ secrets.OPENROUTER_MODEL }}
      LLM_MODEL: ${{ secrets.LLM_MODEL }}
      CRON_SECRET: ${{ secrets.CRON_SECRET }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Comprueba coincidencias y proteccion de datos manuales
        run: |
          node scripts/test-meeting-client-match.mjs
          node scripts/test-import-preservation.mjs
          node scripts/test-translation-preservation.mjs

      - name: Import de llamadas nuevas (Fathom -> Supabase)
        run: node scripts/import-fathom-v2.mjs --apply

      - name: Traduce resúmenes y próximos pasos al español
        if: ${{ env.FATHOM_AUDIT_ONLY != 'true' && (env.OPENROUTER_API_KEY != '' || env.LLM_API_KEY != '') }}
        continue-on-error: true
        run: node scripts/translate-call-texts-es.mjs --apply

      - name: Normaliza nombres de cliente (determinístico)
        if: ${{ env.FATHOM_AUDIT_ONLY != 'true' }}
        run: node scripts/normalize-client-names.mjs --apply

      - name: Enriquece nombres de cliente con LLM
        if: ${{ env.FATHOM_AUDIT_ONLY != 'true' && (env.OPENROUTER_API_KEY != '' || env.LLM_API_KEY != '') }}
        continue-on-error: true
        run: node scripts/enrich-client-names.mjs --apply

      - name: Enriquece títulos de llamada con LLM
        if: ${{ env.FATHOM_AUDIT_ONLY != 'true' && (env.OPENROUTER_API_KEY != '' || env.LLM_API_KEY != '') }}
        continue-on-error: true
        run: node scripts/enrich-call-titles.mjs --apply

      - name: Enriquece rango salarial con LLM
        if: ${{ env.FATHOM_AUDIT_ONLY != 'true' && (env.OPENROUTER_API_KEY != '' || env.LLM_API_KEY != '') }}
        continue-on-error: true
        run: node scripts/enrich-salary-range.mjs --apply

      - name: Comprueba la base operativa de Supabase
        run: node scripts/check-database-health.mjs
